[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "B008",   # FastAPI Depends in defaults — стандарт для FastAPI
    "BLE001", # blind except — нужен для health-check
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert в тестах — норма
